<!-- images/icon_occupied_front_black.svg -->
<svg width="20" height="20" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
    <g fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <!-- Segmento 1: (2, 18) → (10, 10) -->
        <line x1="2" y1="18" x2="10" y2="10"/>
        
        <!-- Segmento 2: (10, 10) → (10, 15) -->
        <line x1="10" y1="10" x2="10" y2="15"/>
        
        <!-- Segmento 3: (10, 15) → (16, 5) -->
        <line x1="10" y1="15" x2="16" y2="5"/>
        
        <!-- Aleta 1: (16, 5) → (13, 5) -->
        <line x1="16" y1="5" x2="13" y2="5"/>
        
        <!-- Aleta 2: (16, 5) → (17, 8) -->
        <line x1="16" y1="5" x2="17" y2="8"/>
    </g>
</svg>